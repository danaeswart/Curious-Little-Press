    <!-- Start single-page-app GitHub Pages redirect handling. See public/404.html
         for the corresponding half of this trick (rafgraph.dev/spa-github-pages). -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <!-- End single-page-app GitHub Pages redirect handling. -->
