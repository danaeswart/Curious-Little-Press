<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Curious Little Press</title>
    <!-- Single-page-app GitHub Pages redirect. GitHub Pages serves this file
         for any unknown path (deep links, refreshes on a route). It encodes
         the requested path into a query string and redirects to the site
         root, where the script in index.html decodes it and restores the
         real URL via history.replaceState before React Router takes over.
         pathSegmentsToKeep = 1 because the app is served from the
         /Curious-Little-Press/ repo subpath. See rafgraph.dev/spa-github-pages. -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
